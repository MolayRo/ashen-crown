# ashencrown.ya1om.com —— 灰烬王冠（纯静态网页游戏，源码 E:\ai\ashen-crown）
server {
    server_name ashencrown.ya1om.com;
    root /var/www/ashencrown;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

    # 代码与素材没有带版本号：每次都向服务器确认（未改动时只回 304，很省流量）
    location = / { add_header Cache-Control "no-cache"; try_files /index.html =404; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location /src/ { add_header Cache-Control "no-cache"; }
    location /assets/ { add_header Cache-Control "no-cache"; }

    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ =404; }

    listen 80;
    listen [::]:80;
}
